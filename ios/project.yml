name: CybionWorker
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: H3445M8J63
    CODE_SIGN_STYLE: Automatic
targets:
  CybionWorker:
    type: application
    platform: iOS
    sources:
      - path: CybionWorker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ntnl.cybion.worker
        PRODUCT_NAME: CybionWorker
        INFOPLIST_FILE: CybionWorker/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: -lcybion_worker_ios
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/built
        SWIFT_OBJC_BRIDGING_HEADER: CybionWorker/CybionWorker-Bridging-Header.h
        # The Rust core is shipped as an arm64 static library; bitcode is not
        # used and Intel Macs are not a target for this personal app.
        ENABLE_BITCODE: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build the Rust worker core
        basedOnDependencyAnalysis: false
        script: |
          set -e
          case "$PLATFORM_NAME" in
            iphoneos) TRIPLE=aarch64-apple-ios ;;
            iphonesimulator) TRIPLE=aarch64-apple-ios-sim ;;
            *) echo "error: unsupported platform $PLATFORM_NAME"; exit 1 ;;
          esac
          # cd first so rust-toolchain.toml (pinned toolchain and targets) applies.
          cd "$SRCROOT/../rust"
          cargo build --target "$TRIPLE" --release
          mkdir -p "$SRCROOT/built"
          cp "$SRCROOT/../rust/target/$TRIPLE/release/libcybion_worker_ios.a" "$SRCROOT/built/"
    postBuildScripts:
      - name: Bundle and sign the userland
        basedOnDependencyAnalysis: false
        script: |
          set -e
          case "$PLATFORM_NAME" in
            iphoneos) USERLAND="$SRCROOT/../third_party/bin" ;;
            iphonesimulator) USERLAND="$SRCROOT/../third_party/bin/sim" ;;
            *) echo "error: unsupported platform $PLATFORM_NAME"; exit 1 ;;
          esac
          BIN="$CODESIGNING_FOLDER_PATH/bin"
          mkdir -p "$BIN"
          cp "$USERLAND/mksh-sh" "$BIN/mksh-sh"
          cp "$USERLAND/busybox" "$BIN/busybox"
          chmod +x "$BIN/mksh-sh" "$BIN/busybox"
          # Nested executables must carry a signature before the app's seal is
          # computed; CI builds without an identity skip this step.
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$BIN/mksh-sh"
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$BIN/busybox"
          fi
