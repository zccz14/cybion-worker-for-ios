[package]
name = "cybion-worker-ios"
version = "0.1.4"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Cybion Worker core for iOS"

[lib]
name = "cybion_worker_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Logging on iOS goes through the os_log C API directly; no extra crate.

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
